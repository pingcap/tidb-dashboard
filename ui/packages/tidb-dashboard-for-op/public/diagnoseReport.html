<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="referrer" content="no-referrer" />
    <meta name="x-distro-strings-res" content="__DISTRO_STRINGS_RES__" />
    <meta
      name="x-distro-assets-res-timestamp"
      content="__DISTRO_ASSETS_RES_TIMESTAMP__"
    />
    <link
      rel="icon"
      href="%PUBLIC_URL%/distro-res/favicon.ico?t=__DISTRO_ASSETS_RES_TIMESTAMP__"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="%PUBLIC_URL%/diagnoseReport.css?t=%TIME_PLACE_HOLDER%"
    />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script
      type="module"
      src="%PUBLIC_URL%/diagnoseReport.js?t=%TIME_PLACE_HOLDER%"
    ></script>
    <script>
      window.addEventListener('load', function () {
        const reportToken = new URLSearchParams(window.location.search).get(
          'token'
        )
        if (!reportToken) {
          window.alert('Invalid report token parameter!')
          return
        }

        const dataScript = document.createElement('script')
        dataScript.src = `./data.js?token=${encodeURIComponent(reportToken)}`
        dataScript.onload = function () {
          window.dispatchEvent(
            new CustomEvent('dashboard:diagnose_report_event')
          )
        }
        dataScript.onerror = function () {
          window.alert('Failed to load diagnosis report data!')
        }
        document.head.appendChild(dataScript)
      })
    </script>
  </body>
</html>
